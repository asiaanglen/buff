<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Buff — You're offline</title>
    <style>
      body {
        margin: 0;
        background: #f7f8fa;
        color: #262333;
        font: 18px system-ui;
        display: grid;
        min-height: 100dvh;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      a {
        display: inline-block;
        background: #ded5f5;
        color: inherit;
        padding: 1rem 1.5rem;
        border-radius: 1rem;
        text-decoration: none;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Reconnect to open Buff.</h1>
      <p>
        Your saved workouts are still there. Connect to the internet, then open
        Buff to sign in and load your journal.
      </p>
      <p>
        If Buff is already open, keep that window open to continue logging.
        Pending changes sync when you reconnect.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
